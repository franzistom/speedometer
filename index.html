<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Speedometer</title>
<style>
  :root {
    --bg: #000;
    --fg: #f2f2f2;
    --dim: #5a5a5a;
    --faint: #1c1c1c;
    --accent: #00e0ff;
    --warn: #ffb000;
    --hot: #ff3b3b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: fixed; inset: 0;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 0 24px;
  }

  /* Top bar */
  #status {
    grid-column: 1; grid-row: 1; align-self: start;
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(11px, 2.2vh, 15px); color: var(--dim); letter-spacing: .04em;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); }
  #dot.ok { background: #19d26b; }
  #dot.wait { background: var(--warn); }

  #clock {
    grid-column: 2; grid-row: 1; justify-self: end; text-align: right; line-height: 1.1;
  }
  #time { font-size: clamp(22px, 7vh, 48px); font-weight: 300; font-variant-numeric: tabular-nums; }
  #date { font-size: clamp(11px, 2.6vh, 17px); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }

  /* Gauge */
  #gaugeWrap {
    grid-column: 1; grid-row: 1 / span 2;
    display: flex; align-items: center; justify-content: center; min-height: 0;
  }
  #gauge { width: 100%; height: 100%; max-height: 92vh; }
  #needle { transition: transform .45s cubic-bezier(.25,.8,.3,1); transform-origin: 150px 150px; }
  #arcActive { transition: stroke-dashoffset .45s cubic-bezier(.25,.8,.3,1); }

  /* Digital */
  #digital {
    grid-column: 2; grid-row: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;
  }
  #speed {
    font-size: clamp(80px, 42vh, 320px); font-weight: 200; line-height: .9;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  }
  #unit { font-size: clamp(14px, 4.5vh, 30px); color: var(--accent); letter-spacing: .3em; margin-top: 1vh; }
  #extra { margin-top: 3vh; font-size: clamp(11px, 2.4vh, 15px); color: var(--dim); letter-spacing: .05em; text-align: center; }

  #fsBtn {
    position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    background: transparent; border: 1px solid var(--faint); color: var(--dim);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; letter-spacing: .05em;
  }
  #fsBtn.hidden { opacity: 0; pointer-events: none; transition: opacity .6s; }

  #start {
    position: fixed; inset: 0; background: #000; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
  }
  #start h1 { font-weight: 200; font-size: 34px; letter-spacing: .08em; }
  #start p { color: var(--dim); max-width: 440px; font-size: 14px; line-height: 1.5; }
  #start button {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 14px 34px; font-size: 17px; letter-spacing: .1em;
  }

  /* Portrait fallback: stack vertically */
  @media (orientation: portrait) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr 1fr; }
    #status { grid-column: 1; grid-row: 1; }
    #clock { grid-column: 1; grid-row: 1; }
    #gaugeWrap { grid-column: 1; grid-row: 3; }
    #digital { grid-column: 1; grid-row: 4; }
    #speed { font-size: clamp(80px, 22vh, 220px); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="status"><span id="dot" class="wait"></span><span id="gpsText">GPS…</span></div>
  <div id="clock"><div id="time">--:--</div><div id="date">---</div></div>

  <div id="gaugeWrap">
    <svg id="gauge" viewBox="0 0 300 300" aria-label="Analog speedometer">
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#00e0ff"/>
          <stop offset="70%" stop-color="#00e0ff"/>
          <stop offset="85%" stop-color="#ffb000"/>
          <stop offset="100%" stop-color="#ff3b3b"/>
        </linearGradient>
      </defs>
      <path id="arcBg" fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round"/>
      <path id="arcActive" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
      <g id="ticks"></g>
      <g id="needle">
        <line x1="150" y1="150" x2="150" y2="42" stroke="#ff3b3b" stroke-width="3" stroke-linecap="round"/>
        <line x1="150" y1="150" x2="150" y2="170" stroke="#ff3b3b" stroke-width="3" stroke-linecap="round"/>
      </g>
      <circle cx="150" cy="150" r="8" fill="#000" stroke="#444" stroke-width="2"/>
      <text x="150" y="215" text-anchor="middle" fill="#5a5a5a" font-size="12" letter-spacing="3">MPH</text>
    </svg>
  </div>

  <div id="digital">
    <div id="speed">0</div>
    <div id="unit">MPH</div>
    <div id="extra"><span id="maxTxt">MAX 0</span> &nbsp;·&nbsp; <span id="accTxt">±– m</span></div>
  </div>
</div>

<button id="fsBtn">⛶ FULL SCREEN</button>

<div id="start">
  <h1>SPEEDOMETER</h1>
  <p>Uses your device GPS. Tap start and allow location access. Tap anywhere later to toggle full screen.</p>
  <button id="startBtn">START</button>
</div>

<script>
(() => {
  const MAX_MPH = 140;          // gauge range
  const START_ANG = -135, END_ANG = 135; // degrees, 0 = straight up
  const CX = 150, CY = 150, R = 120;
  const MS_TO_MPH = 2.2369363;

  const $ = id => document.getElementById(id);

  // ---------- Gauge geometry ----------
  const pt = (ang, r) => {
    const a = (ang - 90) * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  };
  const arcPath = (a0, a1, r) => {
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
  };
  const arcD = arcPath(START_ANG, END_ANG, R);
  $('arcBg').setAttribute('d', arcD);
  const active = $('arcActive');
  active.setAttribute('d', arcD);
  const arcLen = active.getTotalLength();
  active.style.strokeDasharray = arcLen;
  active.style.strokeDashoffset = arcLen;

  const ticks = $('ticks');
  const NS = 'http://www.w3.org/2000/svg';
  for (let v = 0; v <= MAX_MPH; v += 5) {
    const ang = START_ANG + (v / MAX_MPH) * (END_ANG - START_ANG);
    const major = v % 20 === 0;
    const [x0, y0] = pt(ang, R - 10);
    const [x1, y1] = pt(ang, R - (major ? 24 : 16));
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x0); l.setAttribute('y1', y0);
    l.setAttribute('x2', x1); l.setAttribute('y2', y1);
    l.setAttribute('stroke', major ? '#cfcfcf' : '#3a3a3a');
    l.setAttribute('stroke-width', major ? 2.5 : 1.5);
    ticks.appendChild(l);
    if (major) {
      const [tx, ty] = pt(ang, R - 40);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', tx); t.setAttribute('y', ty + 5);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('fill', '#8a8a8a');
      t.setAttribute('font-size', '14');
      t.textContent = v;
      ticks.appendChild(t);
    }
  }

  // ---------- Speed rendering ----------
  let shown = 0, maxSpeed = 0;
  function render(mph) {
    mph = Math.max(0, mph);
    const clamped = Math.min(mph, MAX_MPH);
    const ang = START_ANG + (clamped / MAX_MPH) * (END_ANG - START_ANG);
    $('needle').style.transform = `rotate(${ang}deg)`;
    active.style.strokeDashoffset = arcLen * (1 - clamped / MAX_MPH);
    const rounded = Math.round(mph);
    $('speed').textContent = rounded;
    if (rounded > maxSpeed) { maxSpeed = rounded; $('maxTxt').textContent = 'MAX ' + maxSpeed; }
  }
  render(0);

  // ---------- GPS ----------
  let last = null, watchId = null, staleTimer = null;
  const hav = (a, b) => {
    const R = 6371000, toR = Math.PI / 180;
    const dLat = (b.latitude - a.latitude) * toR, dLon = (b.longitude - a.longitude) * toR;
    const s = Math.sin(dLat/2)**2 + Math.cos(a.latitude*toR) * Math.cos(b.latitude*toR) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  };
  function setStatus(cls, text) { $('dot').className = cls; $('gpsText').textContent = text; }

  function onPos(p) {
    const c = p.coords;
    let ms = c.speed;
    // Fallback if the device doesn't report speed: derive from distance / time
    if (ms == null || isNaN(ms)) {
      if (last) {
        const dt = (p.timestamp - last.timestamp) / 1000;
        ms = dt > 0 ? hav(last.coords, c) / dt : 0;
      } else ms = 0;
    }
    last = p;
    let mph = ms * MS_TO_MPH;
    if (mph < 1) mph = 0;               // kill GPS jitter when stationary
    shown = shown ? shown * 0.3 + mph * 0.7 : mph;  // light smoothing
    if (mph === 0) shown = 0;
    render(shown);
    $('accTxt').textContent = '±' + Math.round(c.accuracy) + ' m';
    setStatus(c.accuracy <= 30 ? 'ok' : 'wait', c.accuracy <= 30 ? 'GPS' : 'GPS WEAK');
    clearTimeout(staleTimer);
    staleTimer = setTimeout(() => setStatus('wait', 'GPS LOST'), 8000);
  }
  function onErr(e) {
    setStatus('', e.code === 1 ? 'LOCATION DENIED' : 'NO GPS');
  }
  function startGps() {
    if (!('geolocation' in navigator)) { setStatus('', 'NO GPS'); return; }
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }

  // ---------- Clock ----------
  function tick() {
    const d = new Date();
    $('time').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    $('date').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
  }
  tick(); setInterval(tick, 1000);

  // ---------- Keep screen awake ----------
  let lock = null;
  async function wake() {
    try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { wake(); startGps(); }
  });

  // ---------- Fullscreen ----------
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function toggleFs() {
    const el = document.documentElement;
    if (!fsEl()) {
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
      try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) {}
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }
  const fsBtn = $('fsBtn');
  const syncBtn = () => fsBtn.classList.toggle('hidden', !!fsEl());
  document.addEventListener('fullscreenchange', syncBtn);
  document.addEventListener('webkitfullscreenchange', syncBtn);
  fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
  $('app').addEventListener('click', toggleFs);

  // ---------- Start ----------
  $('startBtn').addEventListener('click', () => {
    $('start').remove();
    startGps(); wake(); toggleFs();
  });
})();
</script>
</body>
</html>
